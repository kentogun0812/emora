name: emora
description: "Understand Without Words - Couple connection and reproductive health tracking app."
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization / i18n
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  # State Management
  flutter_bloc: ^8.1.3
  hydrated_bloc: ^9.1.2
  equatable: ^2.0.5

  # Backend Integration
  supabase_flutter: ^2.5.0

  # Firebase Push Notifications
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^16.1.0

  # Local Cache & Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI Libraries
  table_calendar: ^3.0.9
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0

  # Device Hardware Integration
  shake: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets for localization i18n JSON files
  assets:
    - assets/i18n/
